# Render Blueprint Specification for FinGuard AI
# Documentation: https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Multi-Agent AML Backend Service
  - type: web
    name: finguard-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.8
      - key: ENVIRONMENT
        value: production

  # 2. React / Vite Forensic Intelligence Dashboard (Static Site)
  - type: static
    name: finguard-frontend
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: finguard-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
