version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finguard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./finguard_aml.db
    volumes:
      - finguard-data:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  finguard-data:
